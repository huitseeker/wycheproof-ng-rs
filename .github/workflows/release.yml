name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to retry, for example v0.3.0"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  preflight:
    name: verify release prerequisites
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Check release tag
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use the vX.Y.Z form, such as v0.3.0."
            exit 1
          fi
          if ! git ls-remote --exit-code --tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${RELEASE_TAG}" >/dev/null
          then
            echo "::error::Release tag ${RELEASE_TAG} does not exist. Create and publish the GitHub release at the intended commit before running this workflow."
            exit 1
          fi

  release:
    name: publish crate family
    needs: preflight
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.version }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Validate checked out tag
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "missing release tag" >&2
            exit 1
          fi
          git fetch --tags --force
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "checkout ${head_commit} does not match ${RELEASE_TAG} (${tag_commit})" >&2
            exit 1
          fi

      - name: Verify vectors offline
        run: scripts/verify-wycheproof-data-offline.sh

      - name: Verify vectors against pinned upstream
        run: scripts/verify-wycheproof-data.sh

      - name: Check upstream drift
        run: scripts/check-wycheproof-drift.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- --deny warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Docs
        run: cargo doc --workspace --no-deps

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.6

      - name: Supply-chain policy
        run: cargo deny check

      - name: Minimal downstream imports
        run: scripts/verify-minimal-imports.sh

      - name: Check package size budget
        run: scripts/verify-package-sizes.sh

      - name: Verify package artifacts
        run: scripts/publish-workspace.sh --dry-run

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@9f93ac2286e4f1a6e86b5f77b890fda4566f5c03 # main

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: scripts/publish-workspace.sh --publish
